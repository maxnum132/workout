<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สมุดฝึก">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>สมุดฝึก V-shape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky day strip on top, exercise cards, tab bar + rest timer pinned to the bottom */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#EBEDF2; --ink:#14171C; --muted:#5D6573; --line:#DFE2E9;
  --accent:#2F55E4; --accent-ink:#FFFFFF; --accent-soft:#E4EAFD; --done:#178A5E; --done-soft:#DDF3EA; --warn:#A8620B; --warn-soft:#FBEEDB; --bad:#B3372B; --bad-soft:#FBE4E0;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --sunk:#1F232B; --ink:#E8EBF0; --muted:#949CA9; --line:#2A2F39;
  --accent:#7390FF; --accent-ink:#0B0F1A; --accent-soft:#1E2747; --done:#43C792; --done-soft:#14302A; --warn:#E9A64E; --warn-soft:#33260F; --bad:#F08A7E; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --sunk:#1F232B; --ink:#E8EBF0; --muted:#949CA9; --line:#2A2F39;
  --accent:#7390FF; --accent-ink:#0B0F1A; --accent-soft:#1E2747; --done:#43C792; --done-soft:#14302A; --warn:#E9A64E; --warn-soft:#33260F; --bad:#F08A7E; --bad-soft:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 100px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--done)} .status.busy i{background:var(--warn)} .status.err i{background:#D33}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;position:relative}
.day small{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.day.rest{background:transparent;color:var(--muted)}
.day.today{border-color:var(--ink)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.day .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--done)}

/* plan header */
.plan{margin-top:18px;display:grid;gap:10px}
.plan h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
.plan .sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px}
.plan label{display:flex;align-items:center;gap:6px}
.plan input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.barrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.barrow .bar{flex:1}
details.warm{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:6px 12px}
details.warm summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;padding:2px 0}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary::after{content:" ▾";color:var(--muted)}
details.warm p{margin:4px 0 4px}

/* exercise cards */
.list{display:grid;gap:12px;margin-top:16px}
.sect{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px -2px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.ex.complete{border-color:var(--done)}
.exh{display:flex;gap:12px;align-items:flex-start}
.exn{font-family:var(--f-num);font-weight:700;font-size:22px;line-height:1;color:var(--muted);min-width:20px;padding-top:2px}
.ex.complete .exn{color:var(--done)}
.ex h3{margin:0;font-size:16px;line-height:1.3;font-weight:600}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.meta b{color:var(--ink);font-weight:600}
.prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill.up{background:var(--done-soft);color:var(--done)}
.pill.hold{background:var(--warn-soft);color:var(--warn)}
.pill.down{background:var(--bad-soft);color:var(--bad)}
.pill{white-space:normal;text-align:left;border-radius:12px}
.rate{display:grid;gap:6px;margin:10px 0 4px;font-size:12.5px;color:var(--muted)}
.rate div{display:flex;flex-wrap:wrap;gap:6px}
.rate .btn{padding:7px 12px;font-size:13px}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.ex{scroll-margin-top:130px}
.sets{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.sets th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px;letter-spacing:.04em}
.sets th:first-child{text-align:left}
.sets td{padding:3px 2px}
.sets col.c-n{width:26px}.sets col.c-k{width:48px}
.sets td:first-child{font-family:var(--f-num);font-weight:600;color:var(--muted);font-size:17px}
.stp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);height:42px}
.stp button{width:32px;flex:none;border:0;background:var(--sunk);font-size:20px;font-weight:600;line-height:1;color:var(--ink);touch-action:manipulation}
.stp button:active{background:var(--line)}
.stp input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0 2px;font-family:var(--f-num);font-size:19px;font-weight:600;text-align:center}
.stp input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
tr.done .stp{background:var(--done-soft);border-color:transparent}
tr.done .stp button{background:transparent;color:var(--done)}
.chk{width:44px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;touch-action:manipulation;margin-left:auto}
.chk svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.5}
tr.done .chk{background:var(--done);border-color:var(--done)}
tr.done .chk svg{stroke:#fff}
.fold{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left}
.fold .exn{color:var(--done)}
.fold .fn{flex:1;min-width:0}
.fold .fn b{display:block;font-size:15px;font-weight:600}
.fold .fn span{display:block;font-size:12.5px;color:var(--muted);font-family:var(--f-num);font-size:14px}
.fold .ed{font-size:12px;color:var(--accent);font-weight:600}
.ex.folded{padding:11px 14px}
.unfold{margin-left:auto;font-size:12px;color:var(--accent);background:none;border:0;font-weight:600;padding:2px 0 2px 8px}
.planchip{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{display:grid;gap:6px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.banner b{color:var(--warn)}
.banner .edbar{margin:2px 0 0}
.banner .btn{flex:0 1 auto}
.prow{display:grid;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.prow:first-of-type{border-top:0}
.wkact{display:flex;gap:8px;align-items:center}
.wkact .btn{flex:none;padding:7px 12px}
.wkact select{flex:1;min-width:0}
.swapbox{display:grid;gap:8px;background:var(--sunk);border-radius:10px;padding:10px;margin-top:10px}
.swapbox .note{margin:0}
.edfull select{width:100%}
.ptop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ptop .btn{flex:none;margin-top:3px}
.edcard{display:grid;gap:10px}
.edtop{display:flex;align-items:center;gap:10px}
.edname{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-weight:600;font-size:15px}
.edgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.edgrid label,.edfull{display:grid;gap:3px;font-size:11.5px;color:var(--muted)}
.edgrid input,.edgrid select,.edfull input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:15px}
.edgrid input:disabled{opacity:.45}
.edchk{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.edchk label{display:flex;align-items:center;gap:6px}
.edchk input{width:18px;height:18px;accent-color:var(--accent)}
.edbtns{display:flex;gap:8px;justify-content:flex-end}
.edbtns .btn:disabled{opacity:.35}
.edbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.edbar .btn{flex:1 1 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .btn{font-size:18px;padding:2px 12px}
.mhead .btn:disabled{opacity:.35}
textarea{width:100%;min-height:72px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font:inherit;color:inherit;resize:vertical}
.sum{background:var(--surface);border:1.5px solid var(--done);border-radius:var(--r);padding:16px;scroll-margin-top:130px}
.sum h2{margin:0 0 4px;font-size:17px}
.sum .big{font-family:var(--f-num);font-size:30px;font-weight:700}
.sum ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.sum li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sum li span:last-child{color:var(--done);font-weight:600;text-align:right}
details.how{margin-top:6px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;padding:4px 0;list-style:none;font-weight:500}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+ "}
details.how[open] summary::before{content:"– "}
details.how p{margin:2px 0 6px;color:var(--ink)}
details.how a{color:var(--accent)}
.rest-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.rest-card h2{margin:0 0 6px;font-size:18px}
.rest-card ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}

/* panels */
.panel{display:grid;gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{margin:0 0 10px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .v{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .k{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row .r{color:var(--muted);font-size:13px;text-align:right}
.rowbtn{width:100%;background:none;border:0;text-align:left;padding:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;min-width:0;width:100%}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:10px 14px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:#D33;color:#fff}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent)}
.chart .end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.note{font-size:12.5px;color:var(--muted)}
.note a{color:var(--accent)}

/* bottom: timer + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.timer{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.timer .t{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1;min-width:76px;font-variant-numeric:tabular-nums}
.timer .lab{flex:1;font-size:13px;color:var(--muted);min-width:0}
.timer .tb{height:4px;background:var(--sunk);border-radius:99px;margin-top:5px;overflow:hidden}
.timer .tb span{display:block;height:100%;background:var(--accent)}
.timer.go .t{color:var(--done)}
.timer .btn{padding:7px 10px;font-size:13px}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:10px 0 12px;font-size:13px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.day small{display:none}.stat .v{font-size:22px}}
</style>
</head>
<body>
<div class="wrap"><header>
    <div class="top">
      <div class="brand">สมุดฝึก V-shape<small>5 วัน/สัปดาห์ · ดัมเบล + บาร์โหน + ยางยืด</small></div>
      <div class="status" id="status"><i></i><span>กำลังโหลด…</span></div>
    </div>
    <div class="days" id="days" role="group" aria-label="เลือกวัน"></div>
  </header>
  <main id="main"></main>
</div>

<div class="dock">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-train" data-tab="train"><svg viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>ฝึก</button>
    <button class="tab" role="tab" id="tab-hist" data-tab="hist"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>ความคืบหน้า</button>
    <button class="tab" role="tab" id="tab-body" data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M6 9h12M12 9v6M9 21l3-6 3 6"/></svg>ร่างกาย</button>
  </nav>
</div>

<script>
/* ---------- program ---------- */
const DAYS=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DAYFULL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const NOTION='https://app.notion.com/p/41533fefdc76817f9c8cc21d6022f913';
// r=[low,high] reps (or seconds when u:'sec'); u:'max' = as many as possible, high = goal
// bw=no weight field; side=per side; abs=core block; rest seconds
// pull-up block for someone who can do 1–3 reps: many short sets instead of a few max sets
const PU_CUE='ดึงอกเข้าหาบาร์ ลงจนแขนตึงทุกครั้ง ห้ามเหวี่ยง · หยุดก่อนหมดแรง 1 ครั้ง · ทำได้ 3 ครั้งครบทุกเซต → ปรับเป็น 4 เซต × 3–5';
const BAND_PU={id:'bandpullup',n:'Band-assisted Pull-up',s:2,r:[5,8],bw:1,band:'ดำ',rest:90,c:'คล้องยางกับบาร์ เหยียบหรือคุกเข่าบนยาง ดึงเต็มระยะ ลงช้า 2–3 วิ · ได้ 8 ครั้งทุกเซต → เปลี่ยนเป็นยางที่เบาลง'};
const DEFAULT_P={
 0:{name:'ขา A + Core',short:'ขา A',warm:'วอร์ม 5 นาที: ย่ำเท้า/กระโดดตบเบาๆ 2 นาที → Bodyweight Squat 15 ครั้ง → Hip Hinge 10 ครั้ง',ex:[
  {id:'goblet',n:'Goblet Squat',s:4,r:[8,12],w:'14–16',rest:90,c:'ถือดัมเบลชิดอก ยกส้นเท้าขึ้นเล็กน้อย ลงช้า 3 วิ เข่าไปตามแนวปลายเท้า อกตั้ง'},

const clone=o=>JSON.parse(JSON.stringify(o));

let P={};
// PL: every saved plan; P: the 7 days of the active one (null = rest day)
let PL={active:'main',list:{}};
const EXNAME={};
function rebuildExName(){
  for(const k in EXNAME)delete EXNAME[k];
  const add=(e,force)=>{if(e&&e.id&&(force||!EXNAME[e.id]))EXNAME[e.id]=e};
  Object.values(DEFAULT_P).forEach(d=>d&&d.ex.forEach(e=>add(e)));
  Object.values(PL.list).forEach(pl=>Object.values(pl.days).forEach(d=>d.ex.forEach(e=>add(e))));
  Object.values(S.sessions||{}).forEach(s=>{if(s&&s.swap)Object.values(s.swap).forEach(e=>add(e))});
  Object.values(P).forEach(d=>d&&d.ex.forEach(e=>add(e,true)));
}
// one exercise from the stored program, coerced into the shape the page expects
function cleanEx(e,i){
  if(!e||typeof e!=='object')return null;
  const n=String(e.n||'').trim().slice(0,80);if(!n)return null;
  const id=/^[A-Za-z0-9_-]{1,40}$/.test(e.id)?e.id:'c'+i+Date.now().toString(36);
  const s=Math.min(10,Math.max(1,Math.round(+e.s)||3));
  let lo=Math.max(0,Math.round(+(e.r&&e.r[0]))||0),hi=Math.max(0,Math.round(+(e.r&&e.r[1]))||0);
  if(!hi)hi=lo||10;if(!lo)lo=hi;if(lo>hi)[lo,hi]=[hi,lo];
  const o={id,n,s,r:[lo,hi],rest:Math.min(600,Math.max(0,Math.round(+e.rest)||60)),c:String(e.c||'').slice(0,400)};
  if(e.u==='sec'||e.u==='max')o.u=e.u;
  if(e.bw)o.bw=1;if(e.side)o.side=1;if(e.abs)o.abs=1;
  if(!o.bw&&e.w)o.w=String(e.w).slice(0,30);
  if(e.band)o.band=String(e.band).slice(0,30);
  return o;
}
function cleanDay(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.ex))return null;
  const ex=d.ex.map(cleanEx).filter(Boolean);if(!ex.length)return null;
  const name=String(d.name||'').trim().slice(0,60)||'โปรแกรม';
  return {name,short:String(d.short||'').trim().slice(0,12)||name.slice(0,12),warm:String(d.warm||'').slice(0,400),ex};
}
const okKey=k=>/^[A-Za-z0-9_-]{1,40}$/.test(k);
// saved plans made before the pull-up change still have 'as many as possible, goal 8';
// switch only exercises that still look exactly like the old defaults, so custom edits stay
function migratePullups(){
  let changed=false;
  for(const pl of Object.values(PL.list))for(const [d,day] of Object.entries(pl.days)){
    const i=day.ex.findIndex(e=>e.id==='pullup'&&e.u==='max'&&e.r[1]===8);
    if(i<0)continue;
    const fri=+d===5,e=day.ex[i];
    delete e.u;e.s=fri?4:5;e.r=[1,3];e.rest=90;
    e.c=fri?'Chin-up คือหงายมือ ง่ายกว่าเล็กน้อย ใช้สลับได้ · '+PU_CUE:PU_CUE;
    if(!fri){
      const n=day.ex.findIndex(x=>x.id==='negpull');
      if(n>=0&&day.ex[n].s===2)day.ex[n].s=3;
      if(!day.ex.some(x=>x.id==='bandpullup'))day.ex.splice((n>=0?n:i)+1,0,clone(BAND_PU));
    }
    changed=true;
  }
  return changed;
}
function applyProgram(){
  const raw=S.config&&S.config.plans;
  PL={active:'main',list:{}};
  if(raw&&raw.list&&typeof raw.list==='object'){
    for(const [id,pl] of Object.entries(raw.list)){
      if(!okKey(id)||!pl||typeof pl!=='object')continue;
      const days={};for(let d=0;d<7;d++){const c=cleanDay(pl.days&&pl.days[d]);if(c)days[d]=c}
      PL.list[id]={name:String(pl.name||'').trim().slice(0,40)||'ตาราง',days};
    }
    PL.active=PL.list[raw.active]?raw.active:Object.keys(PL.list)[0];
  }
  if(Object.keys(PL.list).length&&migratePullups())S.config.plans={active:PL.active,list:clone(PL.list),updated:Date.now()},queueSave('config','plans');
  if(!Object.keys(PL.list).length){
    // first run: the built-in program, plus per-day edits saved by the older single-plan version
    const legacy=(S.config&&S.config.program&&S.config.program.days)||{};
    const days={};
    for(let d=0;d<7;d++){
      if(!DEFAULT_P[d])continue;
      days[d]=clone(DEFAULT_P[d]);days[d].warm=days[d].warm.replace(/^วอร์ม 5 นาที: /,'');
      if(Array.isArray(legacy[d])){const ex=legacy[d].map(cleanEx).filter(Boolean);if(ex.length)days[d].ex=ex}
    }
    PL.list={main:{name:'V-shape 5 วัน',days}};PL.active='main';
  }
  P={};for(let d=0;d<7;d++)P[d]=PL.list[PL.active].days[d]||null;
  rebuildExName();
}
function savePlans(){S.config.plans={active:PL.active,list:clone(PL.list),updated:Date.now()};queueSave('config','plans');applyProgram()}

function lsLoad(){try{const j=JSON.parse(localStorage.getItem('wk2-data')||'{}');S.sessions=j.sessions||{};S.body=j.body||{};S.config=j.config||{}}catch(e){}applyProgram()}
function lsSave(){try{localStorage.setItem('wk2-data',JSON.stringify(S))}catch(e){}}

function setStatus(kind,text){const el=$('#status');el.className='status '+(kind||'');el.querySelector('span').textContent=text}
const pending=new Set(),timers={},writing={},again={};
function queueSave(col,id){
  const k=col+'/'+id;pending.add(k);setStatus('busy','กำลังบันทึก…');
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(col,id),700);
}
async function flush(col,id){
  const k=col+'/'+id;
  if(writing[k]){again[k]=true;return}
  writing[k]=true;
  try{
    const val=S[col][id];
    if(db){ if(val) await db.doc(k).set(JSON.parse(JSON.stringify(val))); else await db.doc(k).delete(); }
    else lsSave();
    setStatus('ok',db?'บันทึกแล้ว':'บันทึกในเครื่องนี้');
  }catch(e){
    if(e&&e.code==='unavailable'){setTimeout(()=>{writing[k]=false;flush(col,id)},800+Math.random()*800);return}
    setStatus('err',e&&e.code==='quota_exceeded'?'พื้นที่เต็ม':'บันทึกไม่สำเร็จ');lsSave();
  }
  writing[k]=false;
  if(again[k]){again[k]=false;flush(col,id)}else pending.delete(k);
}
async function initDb(){
  let d=null;
  try{ if(window.claude&&window.claude.use) d=await window.claude.use('db') }catch(e){}
  if(!d){setStatus('','บันทึกในเครื่องนี้');return}
  db=d;mode='cloud';
  let first={sessions:false,body:false};
  const to=setTimeout(()=>{if(!first.sessions)setStatus('busy','ยังเชื่อมต่อไม่ได้ ข้อมูลอาจไม่ล่าสุด')},10000);
  const sub=col=>db.collection(col).onSnapshot(snap=>{
    const next={};snap.docs.forEach(x=>{next[x.id]=JSON.parse(JSON.stringify(x.data()))});
    for(const k of pending){const [c,id]=k.split('/');if(c===col)next[id]=S[col][id]}
    S[col]=next;
    if(col==='config')applyProgram();
    if(col==='sessions')rebuildExName();
    if(!snap.metadata.fromCache){first[col]=true;if(first.sessions&&first.body){clearTimeout(to);if(!pending.size)setStatus('ok','ซิงก์แล้ว')}}
    softRender();
  },err=>{clearTimeout(to);setStatus('err',err.code==='revoked'?'ไม่มีสิทธิ์บันทึก':'เชื่อมต่อไม่ได้')});
  sub('sessions');sub('body');sub('config');
}

/* ---------- session helpers ---------- */
const sKey=()=>st.date+'_'+st.dow;
function getSession(create){
  const k=sKey();let s=S.sessions[k];
  if(!s&&create){s=S.sessions[k]={date:st.date,dow:st.dow,plan:PL.active,pn:P[st.dow]?P[st.dow].short:'',sets:{},updated:Date.now()}}
  return s;
}
function lastFor(exId){
  const cur=sKey();let best=null;
  for(const [k,s] of Object.entries(S.sessions)){
    if(k===cur||!s||s.date>st.date)continue;
    const arr=(s.sets&&s.sets[exId]||[]).filter(x=>x&&x.d);
    if(!arr.length)continue;
    if(!best||s.date>best.s.date||(s.date===best.s.date&&(s.updated||0)>(best.s.updated||0)))best={s,arr};
  }
  return best;
}
// every earlier session of this exercise, newest first (deload weeks don't count as a reference)
function histFor(exId){
  const cur=sKey(),out=[];
  for(const [k,s] of Object.entries(S.sessions)){
    if(k===cur||!s||s.dl||s.date>st.date)continue;
    const arr=((s.sets&&s.sets[exId])||[]).filter(x=>x&&x.d);
    if(arr.length)out.push({s,arr});
  }
  return out.sort((a,b)=>a.s.date<b.s.date?1:a.s.date>b.s.date?-1:(b.s.updated||0)-(a.s.updated||0));
}
const FX={e:'ง่าย เหลือแรง',ok:'พอดี',h:'ฝืน / เหวี่ยงช่วย / ฟอร์มหลุด'};
// what one past session says: target met? any set under the range? how hard it felt
function judge(e,h){
  const reps=h.arr.map(x=>num(x.r)||0),ws=h.arr.map(x=>num(x.w)).filter(x=>x!=null);
  const need=Math.min(e.s,(h.s.ns&&h.s.ns[e.id])||e.s),top=ws.length?Math.max(...ws):null;
  return {reps,need,total:reps.reduce((a,b)=>a+b,0),top,
    same:!!e.bw||(ws.length===h.arr.length&&ws.every(w=>w===top)),
    met:h.arr.length>=need&&reps.every(r=>r>=e.r[1]),
    low:e.r[0]<e.r[1]&&reps.some(r=>r<e.r[0]),
    short:reps.filter(r=>r<e.r[1]).length,
    fx:(h.s.fx&&h.s.fx[e.id])||''};
}
function hint(e){
  const P_=(c,t)=>'<span class="pill '+c+'">'+t+'</span>';
  const H=histFor(e.id);
  if(!H.length)return P_('new','ครั้งแรก · เริ่มเบาๆ เน้นฟอร์ม');
  const a=judge(e,H[0]),b=H[1]?judge(e,H[1]):null,c=H[2]?judge(e,H[2]):null,lo=e.r[0],hi=e.r[1];
  const half=v=>fmt(Math.max(0,Math.round(v*2)/2));
  const sameLoad=x=>!!x&&(e.bw||(x.same&&x.top===a.top));
  if(e.u==='max'){
    const best=Math.max(...a.reps);
    if(best>=hi)return a.fx==='h'?P_('hold','ถึง '+hi+' ครั้งแล้วแต่ยังฝืน · ทำให้นิ่งอีกครั้งก่อน'):a.fx?P_('up','ทำได้ '+hi+' ครั้งแล้ว · ลองถ่วงน้ำหนัก'):P_('hold','ถึง '+hi+' ครั้งแล้ว · กดบอกความยากหลังเล่น ถ้าง่ายหรือพอดีค่อยถ่วงน้ำหนัก');
    return P_('hold','เป้า '+hi+' ครั้ง · ล่าสุดสูงสุด '+best+' · วันนี้ลอง '+(best+1));
  }
  // same load three times running without getting anywhere
  if(!a.met&&b&&c&&!b.met&&!c.met&&sameLoad(b)&&sameLoad(c)&&a.total<=c.total)
    return P_('down',e.bw?'ค้างมา 3 ครั้ง · พักให้พอ แล้วลดเป้าลงเล็กน้อยค่อยไล่ใหม่':'ค้างที่ '+fmt(a.top)+' กก. มา 3 ครั้ง · ลดเหลือ ~'+half(a.top*0.9)+' กก. แล้วไล่ขึ้นใหม่');
  if(a.met){
    if(!a.same)return P_('hold','ครบแล้วแต่น้ำหนักไม่เท่ากัน · ทำให้ครบที่ '+fmt(a.top)+' กก. ทุกเซต');
    if(a.fx==='h')return P_('hold','ครบแล้วแต่ฝืนหรือเหวี่ยงช่วย · น้ำหนักเดิมอีกครั้งให้ฟอร์มนิ่ง');
    // only a set the user says felt easy or right counts as earned; no rating, no increase
    if(a.fx){
      const why=FX[a.fx];
      if(e.bw)return P_('up','ครบเป้า ('+why+') · เพิ่มครั้ง/เวลา หรือใช้ยางแข็งขึ้น');
      const big=a.fx==='e',st_=a.top<6?[0.5,big?1:0.5]:(big?[1,2.5]:[0.5,1]);
      const rng=st_[0]===st_[1]?half(a.top+st_[0]):half(a.top+st_[0])+'–'+half(a.top+st_[1]);
      return P_('up','↑ ครบแล้ว ('+why+') · ลอง '+rng+' กก.');
    }
    return P_('hold','ครบแล้วแต่ยังไม่ได้บอกความยาก · น้ำหนักเดิม · ครั้งนี้เล่นจบแล้วกดบอกว่าเซตสุดท้ายเป็นยังไง');
  }
  if(a.low)return e.bw?P_('hold','บางเซตยังไม่ถึง '+lo+' · ทำให้ถึง '+lo+' ทุกเซตก่อน'):P_('down','บางเซตไม่ถึง '+lo+' ครั้ง · หนักไป ลองลดเหลือ ~'+half(a.top-(a.top<6?0.5:1))+' กก.');
  if(H[0].arr.length<a.need)return P_('hold','ครั้งก่อนเล่น '+H[0].arr.length+'/'+a.need+' เซต · น้ำหนักเดิม เล่นให้ครบเซต');
  return P_('hold','น้ำหนักเดิม · อีก '+a.short+' เซตยังไม่ถึง '+hi+(e.u==='sec'?' วิ':'')+' · วันนี้เพิ่มเซตละ 1'+(e.u==='sec'?'–5 วิ':' ครั้ง'));
}
function weekDates(){const d=new Date();const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());return [...Array(7)].map((_,i)=>ymd(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i)))}
function sessionDone(s){if(!s||!s.sets)return 0;let n=0;for(const a of Object.values(s.sets))for(const x of a)if(x&&x.d)n++;return n}

/* ---------- deload + the program actually shown for the open day ---------- */
const wkStartOf=s=>{const d=parseYmd(s);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay()))};
const DELOAD_AFTER=6; // full training weeks before a deload is suggested
function deloadInfo(){
  const dl=S.config.deload||{},cur=wkStartOf(st.date),weeks=new Set();
  Object.values(S.sessions).forEach(s=>{if(s&&sessionDone(s)>0){const w=wkStartOf(s.date);if((!dl.week||w>dl.week)&&w<cur)weeks.add(w)}});
  const active=dl.week===cur;
  return {active,weeks:weeks.size,due:!active&&st.date===today&&weeks.size>=DELOAD_AFTER&&dl.snooze!==cur};
}
// today's list = the plan's day, with one-day swaps applied and sets halved in a deload week
function curProg(){
  const base=P[st.dow],s=getSession(false);
  if(!base){
    // rest day in the current plan, but an older session was logged here: show what was logged
    if(!s||sessionDone(s)===0)return null;
    const ex=Object.keys(s.sets||{}).map(id=>EXNAME[id]).filter(Boolean);
    return ex.length?{name:s.pn||'บันทึกเก่า',short:s.pn||'',warm:'',ex,old:true}:null;
  }
  const sw=(s&&s.swap)||{},dl=deloadInfo().active;
  if(!Object.keys(sw).length&&!dl)return base;
  return Object.assign({},base,{ex:base.ex.map(e=>{
    const c=sw[e.id]&&cleanEx(sw[e.id],0);
    let x=c?Object.assign(c,{swapOf:e.id,swapName:e.n,abs:e.abs}):e;
    if(dl)x=Object.assign({},x,{s:Math.max(1,Math.ceil(x.s/2))});
    return x;
  })});
}

function summaryHtml(){

function chart(pts,unit){
  if(pts.length<2)return '<div class="empty">บันทึกอย่างน้อย 2 ครั้งเพื่อดูกราฟ</div>';
  const W=320,H=150,L=34,R=12,T=12,B=24;
  let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));
  if(hi-lo<1){lo-=1;hi+=1}const padY=(hi-lo)*.15;lo-=padY;hi+=padY;
  const xs=i=>L+(W-L-R)*(pts.length===1?0:i/(pts.length-1)),ys=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let k=0;k<3;k++){const v=lo+(hi-lo)*(k+.5)/3;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(v)+'" y2="'+ys(v)+'"/><text class="lbl" x="'+(L-6)+'" y="'+(ys(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>'}
  const line=pts.map((p,i)=>xs(i)+','+ys(p.y)).join(' ');
  const area='M'+xs(0)+','+(H-B)+' L'+line.replace(/ /g,' L')+' L'+xs(pts.length-1)+','+(H-B)+'Z';
  const last=pts[pts.length-1];
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟ '+esc(unit)+'">'+g+'<path class="ar" d="'+area+'"/><polyline class="ln" points="'+line+'"/>'+
    pts.map((p,i)=>'<circle class="pt" cx="'+xs(i)+'" cy="'+ys(p.y)+'" r="2.5"/>').join('')+
    '<circle class="end" cx="'+xs(pts.length-1)+'" cy="'+ys(last.y)+'" r="4.5"/>'+
    '<text class="lbl" x="'+L+'" y="'+(H-6)+'">'+shortDate(pts[0].x)+'</text><text class="lbl" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+shortDate(last.x)+'</text></svg></div>';
}

function workoutsCsv(){

  Object.values(S.sessions).filter(Boolean).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.dow-b.dow).forEach(s=>{
    const prog=s.pn||(P[s.dow]&&P[s.dow].short)||(DEFAULT_P[s.dow]&&DEFAULT_P[s.dow].short)||'';
    for(const [id,arr] of Object.entries(s.sets||{})){(arr||[]).forEach((x,i)=>{if(!x||(!x.w&&!x.r&&!x.d))return;rows.push([s.date,DAYFULL[s.dow],prog,(EXNAME[id]&&EXNAME[id].n)||id,i+1,x.w||'',x.r||'',x.d?'ใช่':'',(s.fx&&FX[s.fx[id]])||''])})}
    if(s.note)rows.push([s.date,DAYFULL[s.dow],prog,'โน้ต','','','',s.note]);
  });
  return csvRows(rows);
}
function bodyCsv(){

function importData(d){
  const okId=k=>/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(k);

  for(const [k,v] of Object.entries(d.body||{})){if(!okId(k)||!v||typeof v!=='object'||num(v.weight)==null)continue;S.body[k]=clone(v);queueSave('body',k);nb++}
  for(const k of ['program','plans','deload']){if(d.config&&d.config[k]&&typeof d.config[k]==='object'){S.config[k]=clone(d.config[k]);queueSave('config',k);if(k!=='deload')cfg=true}}

function localSave(filename,data,type){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();

}

function exArr(exId){
  const e=curProg().ex.find(x=>x.id===exId),s=getSession(true);
  const arr=s.sets[exId]=s.sets[exId]||[];

}
// weight entered in one set flows down to later sets that are still empty or were auto-filled
function propagateW(exId,i,arr,e){
  const val=arr[i].w;if(!val)return;
  for(let j=i+1;j<e.s;j++){
    const x=arr[j];
    if(x.d||(x.w&&!x.wa))continue;
    x.w=val;x.wa=true;
    const el=document.getElementById('w-'+exId+'-'+j);if(el)el.value=val;
  }
}

    const sec=T('.ex'),exId=sec.dataset.ex,n=+sec.dataset.n,s=getSession(true),e=curProg().ex.find(x=>x.id===exId);
    s.fx=s.fx||{};if(s.fx[exId]===v)delete s.fx[exId];else s.fx[exId]=v;
    s.updated=Date.now();queueSave('sessions',sKey());
    if(s.fx[exId]&&exDoneCount(s,exId)>=e.s){st.open.delete(exId);sec.outerHTML=exCard(e,n,s);const ns=document.querySelector('.ex[data-ex="'+exId+'"]');if(ns)scrollNext(ns)}
    else sec.outerHTML=exCard(e,n,s);
    return;
  }
  const sb=ev.target.closest('[data-step]');
  if(sb){
    const tr=sb.closest('tr'),sec=sb.closest('.ex'),exId=sec.dataset.ex,i=+tr.dataset.i,f=sb.dataset.step,d=parseFloat(sb.dataset.d);
    const inp=tr.querySelector('[data-f='+f+']');
    const e=curProg().ex.find(x=>x.id===exId);
    const cur=num(inp.value);let v;
    if(cur==null){ // first tap on an empty field shows last time's value (or the suggested start) as-is
      let s0=num(inp.placeholder);
      if(s0==null&&f==='w')s0=num(String(e.w||'').split(/[–\s]/)[0]);
      v=s0!=null&&s0>0?s0:Math.max(0,d);
    }else v=cur+d;
    v=Math.max(0,Math.round(v*10)/10);
    if(f==='r')v=Math.round(v);
    inp.value=String(v);
    setField(exId,i,f,inp.value);
    return;
  }
  const uf=ev.target.closest('[data-unfold]');
  if(uf){const id=uf.dataset.unfold;st.open.add(id);const sec=uf.closest('.ex');const e=curProg().ex.find(x=>x.id===id);sec.outerHTML=exCard(e,+sec.dataset.n,getSession(false));return}
  const rf=ev.target.closest('[data-refold]');
  if(rf){const id=rf.dataset.refold;st.open.delete(id);const sec=rf.closest('.ex');const e=curProg().ex.find(x=>x.id===id);sec.outerHTML=exCard(e,+sec.dataset.n,getSession(false));return}
  const c=ev.target.closest('.chk');
  if(c){
    const sec=c.closest('.ex'),tr=c.closest('tr'),exId=sec.dataset.ex,i=+tr.dataset.i;
    const {e,s,arr}=exArr(exId);
    const wasDone=arr.filter(z=>z.d).length>=e.s;
    const x=arr[i];const wi=tr.querySelector('[data-f=w]'),ri=tr.querySelector('[data-f=r]');
    x.d=!x.d;
    if(x.d){
      if(wi&&!wi.value&&wi.placeholder)wi.value=wi.placeholder;
      if(!ri.value&&ri.placeholder)ri.value=ri.placeholder;
      if(wi){const nw=wi.value.trim();if(nw!==x.w){x.w=nw;x.wa=false}propagateW(exId,i,arr,e)}
      x.r=ri.value.trim();
    }
    tr.classList.toggle('done',x.d);c.setAttribute('aria-pressed',x.d);
    const nowDone=arr.filter(z=>z.d).length>=e.s;
    sec.classList.toggle('complete',nowDone);
    if(x.d){s.ns=s.ns||{};s.ns[exId]=e.s;if(deloadInfo().active)s.dl=1}
    s.updated=Date.now();queueSave('sessions',sKey());
    refreshProgress();
    if(nowDone!==wasDone){
      const n=+sec.dataset.n;
      if(nowDone&&s.fx&&s.fx[exId]){
        st.open.delete(exId);
        setTimeout(()=>{const cur=document.querySelector('.ex[data-ex="'+exId+'"]');if(!cur)return;cur.outerHTML=exCard(e,n,getSession(false));const ns=document.querySelector('.ex[data-ex="'+exId+'"]');if(ns)scrollNext(ns)},350);
      }else{
        if(nowDone)st.open.add(exId);else st.open.delete(exId);
        sec.outerHTML=exCard(e,n,s);
      }
    }
    return;
  }
  const o=ev.target.closest('[data-open]');
  if(o){const s=S.sessions[o.dataset.open];if(s){st.date=s.date;st.dow=s.dow;st.tab='train';render();scrollTo(0,0)}return}
  const ad=ev.target.closest('[data-askdel]');if(ad){st.delBody=ad.dataset.askdel;renderBody();return}
  const dl=ev.target.closest('[data-del]');if(dl){const k=dl.dataset.del;S.body[k]=null;st.delBody=null;queueSave('body',k);delete S.body[k];renderBody();return}
});
$('#main').addEventListener('submit',ev=>{
  if(ev.target.id!=='bform')return;ev.preventDefault();
  const d=$('#bd').value,w=num($('#bw').value);if(!d||w==null){$('#bw').focus();return}
  const v={weight:w};const bf=num($('#bf').value),ws=num($('#bwst').value);if(bf!=null)v.bf=bf;if(ws!=null)v.waist=ws;
  S.body[d]=Object.assign({},S.body[d]||{},v);queueSave('body',d);renderBody();
});

  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
}
